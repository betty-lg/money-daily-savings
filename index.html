<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日存钱小程序</title>
    <link rel="stylesheet" href="https://unpkg.com/vant/lib/index.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/vant/lib/vant.min.js"></script>
    <style>
        body {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f5;
        }
        .money-card {
            background-color: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .total-savings {
            color: #4CAF50;
            font-size: 1.2em;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="app">
        <h1>每日存钱</h1>
        <div class="money-card">
            <p>日期：{{ today }}</p>
            <p>第 {{ dayNumber }} 天</p>
            <p>随机数：{{ numbers }}</p>
            <p>本次存款：{{ savings }}元</p>
            <p class="total-savings">累计存款：{{ totalSavings }}元</p>
        </div>
        <van-button type="success" block @click="saveToday" style="margin-top: 10px;">保存今日数据</van-button>
        <van-button type="warning" block @click="showHistory" style="margin-top: 10px;">查看历史</van-button>
        <van-dialog v-model:show="showHistoryDialog" title="存款历史" show-cancel-button>
            <van-cell-group>
                <van-cell v-for="(record, index) in history" :key="index">
                    {{ record.date }}(第{{ record.dayNumber }}天): {{ record.savings }}元
                </van-cell>
            </van-cell-group>
        </van-dialog>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue
        const app = createApp({
            setup() {
                const startDate = new Date('2026-05-26')
                const today = ref(new Date().toLocaleDateString())
                const dayNumber = ref(1)
                const numbers = ref([])
                const savings = ref(0)
                const totalSavings = ref(0)
                const history = ref([])
                const showHistoryDialog = ref(false)

                function calculateDayNumber(currentDate) {
                    const current = new Date(currentDate)
                    const diff = Math.floor((current - startDate) / (1000 * 60 * 60 * 24)) + 1
                    return diff
                }

                function loadData() {
                    const savedData = localStorage.getItem('savingsData')

                    // 计算今天是第几天
                    dayNumber.value = calculateDayNumber(new Date())

                    if (savedData) {
                        const data = JSON.parse(savedData)

                        // 计算累计存款
                        totalSavings.value = data.history.reduce((total, record) => total + record.savings, 0)
                        history.value = data.history || []
                    }

                    // 检查今天是否已经生成过数据
                    const todayData = localStorage.getItem('todayData')
                    if (todayData) {
                        const parsedData = JSON.parse(todayData)
                        if (parsedData.date === today.value) {
                            numbers.value = parsedData.numbers
                            savings.value = parsedData.savings
                        } else {
                            generateNumbers()
                        }
                    } else {
                        generateNumbers()
                    }
                }

                function saveToday() {
                    // 检查今天是否已经保存过
                    const todayData = localStorage.getItem('todayData')
                    if (todayData) {
                        const parsedData = JSON.parse(todayData)
                        if (parsedData.date === today.value) {
                            vant.Notify({ type: 'warning', message: '今日数据已保存' });
                            return
                        }
                    }

                    const record = {
                        date: today.value,
                        dayNumber: dayNumber.value,
                        numbers: numbers.value,
                        savings: savings.value
                    }

                    // 保存今日数据
                    localStorage.setItem('todayData', JSON.stringify({
                        date: today.value,
                        numbers: numbers.value,
                        savings: savings.value
                    }))

                    // 添加到历史记录
                    history.value.push(record)

                    // 保存到本地存储
                    localStorage.setItem('savingsData', JSON.stringify({
                        history: history.value
                    }))

                    vant.Notify({ type: 'success', message: '保存成功' });
                }

                function showHistory() {
                    showHistoryDialog.value = true
                }

                function generateNumbers() {
                    // 如果今天已经有数据，不重新生成
                    const todayData = localStorage.getItem('todayData')
                    if (todayData) {
                        const parsedData = JSON.parse(todayData)
                        if (parsedData.date === today.value) {
                            numbers.value = parsedData.numbers
                            savings.value = parsedData.savings
                            return
                        }
                    }

                    const newNumbers = []
                    const usedNumbers = new Set()

                    while (newNumbers.length < 3) {
                        const num = Math.floor(Math.random() * 365) + 1
                        if (!usedNumbers.has(num)) {
                            newNumbers.push(num)
                            usedNumbers.add(num)
                        }
                    }

                    numbers.value = newNumbers
                    savings.value = newNumbers.reduce((a, b) => a + b, 0)

                    // 保存今日数据
                    localStorage.setItem('todayData', JSON.stringify({
                        date: today.value,
                        numbers: numbers.value,
                        savings: savings.value
                    }))
                }

                // 初始化
                onMounted(() => {
                    loadData()
                })

                return {
                    today,
                    dayNumber,
                    numbers,
                    savings,
                    totalSavings,
                    history,
                    showHistoryDialog,
                    saveToday,
                    showHistory
                }
            }
        })

        app.use(vant)
        app.mount('#app')
    </script>
</body>
</html>
